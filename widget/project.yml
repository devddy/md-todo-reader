# Generate the Xcode project with: brew install xcodegen && xcodegen
name: MDTodoWidget
options:
  bundleIdPrefix: com.devddy.mdtodo
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple team id here (Xcode > Settings > Accounts), or pick it in Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MDTodoWidgetHost:
    type: application
    platform: macOS
    sources: [Host, Shared]
    info:
      path: Host/Info.plist
      properties:
        CFBundleDisplayName: MD Todo Widget
        LSApplicationCategoryType: public.app-category.productivity
    entitlements:
      path: Host/Host.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devddy.mdtodo.widgethost
        PRODUCT_NAME: MD Todo Widget
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: MDTodoWidgetExtension
        embed: true
  MDTodoWidgetExtension:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: MD Todo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Lets the sandboxed widget read the notes folder (keep in sync with Config.dailyRelativePath).
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /be3/work/daily/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devddy.mdtodo.widgethost.widget
        ENABLE_HARDENED_RUNTIME: YES
